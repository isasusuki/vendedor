    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    // ==================== FORMATADORES & RECIBOS ====================
    function formatCurrency(val) {
      return (val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(dateIso) {
      if (!dateIso) return '';
      const p = dateIso.split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dateIso;
    }

    function formatDateTimeBR(date = new Date()) {
      return date.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function normalizePhoneBR(phone) {
      const digits = (phone || '').replace(/\D/g, '');
      if (!digits) return '';
      if (digits.length >= 10 && digits.length <= 11 && !digits.startsWith('55')) {
        return `55${digits}`;
      }
      return digits;
    }

    function generateReceiptNumber() {
      const y = new Date().getFullYear();
      const rnd = String(Math.floor(1000 + Math.random() * 9000));
      return `REC-${y}-${rnd}`;
    }

    function isFiadoOverdue(dueDate) {
      if (!dueDate) return false;
      return dueDate < new Date().toISOString().slice(0, 10);
    }

    function getFiadoRemaining(f) {
      const paid = f.paidAmount || 0;
      return Math.max(0, Number((f.totalAmount - paid).toFixed(2)));
    }

    function buildFiadoEntries(fiados) {
      const rows = [];
      fiados.forEach((f) => {
        const paid = f.paidAmount || 0;
        if (f.items && f.items.length > 0) {
          f.items.forEach((item, idx) => {
            rows.push({
              date: f.saleDate,
              dueDate: f.dueDate,
              description: item.productName,
              quantity: item.quantity,
              unitPrice: item.unitPrice,
              total: item.subtotal,
              paidAlready: idx === 0 && paid > 0 ? paid : 0,
            });
          });
        } else {
          rows.push({
            date: f.saleDate,
            dueDate: f.dueDate,
            description: f.notes || `${f.quantity}x Espetinho`,
            quantity: f.quantity || 1,
            unitPrice: f.unitPrice || f.totalAmount,
            total: f.totalAmount,
            paidAlready: paid,
          });
        }
      });
      return rows;
    }

    function buildDetailedWhatsAppMessage(params) {
      const {
        receiptNumber, kind, issuedAt, vendor, eventName, eventLocation,
        customerName, entries, totalGross, totalPaidBefore, amountPaidNow,
        remainingBalance, paymentMethod,
      } = params;

      const titulo =
        kind === 'quitacao_pagamento'
          ? 'RECIBO DE PAGAMENTO / QUITAÇÃO'
          : kind === 'lancamento_fiado'
          ? 'COMPROVANTE DE CONSUMO (FIADO)'
          : 'RECIBO DETALHADO DE COBRANÇA';

      let msg = `*${titulo}*\n`;
      msg += `Nº: *${receiptNumber}* · Emitido em ${issuedAt}\n`;
      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `🍢 *Estabelecimento:* ${vendor.name}\n`;
      msg += `🏟️ *Evento:* ${eventName}\n`;
      if (eventLocation) msg += `📍 *Local:* ${eventLocation}\n`;
      msg += `👤 *Cliente:* ${customerName}\n`;
      msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;

      msg += `📋 *ITENS DETALHADOS:*\n`;
      entries.forEach((e) => {
        const dataTxt = e.date ? `[${formatDateBR(e.date)}] ` : '';
        msg += `• ${dataTxt}${e.quantity}x ${e.description} (${formatCurrency(e.unitPrice)}) = *${formatCurrency(e.total)}*\n`;
      });

      msg += `\n━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `Subtotal dos itens: ${formatCurrency(totalGross)}\n`;
      if (totalPaidBefore > 0) {
        msg += `Abatido anteriormente: -${formatCurrency(totalPaidBefore)}\n`;
      }
      if (amountPaidNow > 0) {
        msg += `✅ *Pago agora (${paymentMethod || 'Caixa'}):* ${formatCurrency(amountPaidNow)}\n`;
      }

      if (remainingBalance > 0) {
        msg += `💰 *SALDO PENDENTE A PAGAR:* *${formatCurrency(remainingBalance)}*\n`;
        const firstDue = entries.find((e) => e.dueDate)?.dueDate;
        if (firstDue) msg += `📅 *Vencimento:* ${formatDateBR(firstDue)}\n`;
        msg += `\n🔑 *Chave Pix (${vendor.pixType || 'Pix'}):* \`${vendor.pixKey}\`\n`;
        msg += `👤 *Favorecido:* ${vendor.name}\n`;
        msg += `📲 *Dúvidas / Comprovante:* wa.me/${normalizePhoneBR(vendor.phone)}\n`;
      } else {
        msg += `🎉 *SITUAÇÃO:* *CONTA QUITADA (Saldo R$ 0,00)*\n`;
        msg += `Obrigado pela preferência! Nos vemos no próximo jogo! ⚽\n`;
      }

      return msg;
    }

    function buildWhatsAppUrl(phone, message) {
      const normalized = normalizePhoneBR(phone);
      const encoded = encodeURIComponent(message);
      return normalized
        ? `https://wa.me/${normalized}?text=${encoded}`
        : `https://wa.me/?text=${encoded}`;
    }

    function createReceiptData(params) {
      const receiptNumber = generateReceiptNumber();
      const issuedAt = formatDateTimeBR();
      const whatsappMessage = buildDetailedWhatsAppMessage({
        receiptNumber,
        issuedAt,
        ...params,
      });
      const whatsappUrl = buildWhatsAppUrl(params.customerPhone, whatsappMessage);
      return { receiptNumber, issuedAt, whatsappMessage, whatsappUrl, ...params };
    }

    function triggerExternalWhatsApp(url) {
      try {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return true;
      } catch {
        return false;
      }
    }

    function baixarEsteHtmlAutonomo() {
      try {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch {
        // ignore
      }
    }

    function ComandasTab({
      session, customers, products, selectedCustomerId, cart, saleDate, dueDate,
      autoNotifyOnLaunch, onChangeSaleDate, onChangeDueDate, onToggleAutoNotify,
      onSelectCustomer, onUpdateCart, onClearCart, onLaunchFiado,
      onOpenPaymentModal, onPreviewCustomerReceipt,
    }) {
      const [customerQuery, setCustomerQuery] = useState('');
      const selectedCustomer = customers.find((c) => c.id === selectedCustomerId) || customers[0];

      const filteredCustomers = useMemo(() => {
        const q = customerQuery.trim().toLowerCase();
        return q ? customers.filter((c) => c.name.toLowerCase().includes(q)) : customers;
      }, [customers, customerQuery]);

      const getPending = (name) =>
        session.fiados.filter((f) => f.customerName.toLowerCase() === name.toLowerCase() && f.status === 'Pendente' && getFiadoRemaining(f) > 0);

      const selectedPending = selectedCustomer ? getPending(selectedCustomer.name) : [];
      const selectedPendingTotal = selectedPending.reduce((s, f) => s + getFiadoRemaining(f), 0);

      const cartEntries = useMemo(() => {
        return Object.entries(cart)
          .filter(([, qty]) => qty > 0)
          .map(([pid, qty]) => {
            const p = products.find((item) => item.id === pid);
            return p ? { product: p, qty, subtotal: p.price * qty } : null;
          })
          .filter(Boolean);
      }, [cart, products]);

      const cartTotal = cartEntries.reduce((s, i) => s + i.subtotal, 0);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <div className="lg:col-span-7 bg-white rounded-xl border border-slate-200 overflow-hidden">
            <div className="p-4 sm:p-5 border-b border-slate-200 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h2 className="text-sm font-bold text-slate-900">1. Cliente & Data do Jogo</h2>
                  <p className="text-xs text-slate-500">Selecione o cliente para abrir ou atualizar a comanda</p>
                </div>
                <div className="flex items-center gap-2 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5">
                  <Icons.Calendar className="w-3.5 h-3.5 text-slate-500" />
                  <input type="date" value={saleDate} onChange={(e) => onChangeSaleDate(e.target.value)} className="text-xs font-mono font-semibold text-slate-900 bg-transparent outline-none" />
                </div>
              </div>

              <div className="relative">
                <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={customerQuery}
                  onChange={(e) => setCustomerQuery(e.target.value)}
                  placeholder="Buscar amigo por nome..."
                  className="w-full pl-8 pr-3 py-2 text-xs border border-slate-200 rounded-lg bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                />
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-56 overflow-y-auto pr-1">
                {filteredCustomers.map((c) => {
                  const isSel = selectedCustomer?.id === c.id;
                  const due = getPending(c.name).reduce((s, f) => s + getFiadoRemaining(f), 0);
                  return (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => onSelectCustomer(c.id)}
                      className={`p-3 rounded-xl border text-left flex items-center gap-2.5 transition-colors cursor-pointer ${
                        isSel ? 'bg-amber-50 border-amber-500 ring-1 ring-amber-500' : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50/70'
                      }`}
                    >
                      <span className="text-xl shrink-0">{c.emoji}</span>
                      <div className="min-w-0 flex-1">
                        <p className="text-xs font-bold text-slate-900 truncate">{c.name}</p>
                        {due > 0 ? (
                          <p className="text-[11px] font-mono font-bold text-rose-700 mt-0.5 tabular-nums">Deve {formatCurrency(due)}</p>
                        ) : (
                          <p className="text-[11px] text-emerald-700 font-medium mt-0.5">Em dia</p>
                        )}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="p-4 sm:p-5">
              <div className="flex items-center justify-between gap-2 mb-3">
                <div>
                  <h2 className="text-sm font-bold text-slate-900">2. Adicionar Produtos</h2>
                  <p className="text-xs text-slate-500">Toque no item para somar na comanda atual</p>
                </div>
                <span className="text-xs font-medium text-slate-500">{products.length} itens</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                {products.map((p) => {
                  const qty = cart[p.id] || 0;
                  return (
                    <button
                      key={p.id}
                      type="button"
                      onClick={() => onUpdateCart(p.id, 1)}
                      className={`p-3.5 rounded-xl border text-left flex flex-col justify-between transition-colors cursor-pointer ${
                        qty > 0 ? 'border-amber-500 bg-amber-50/60' : 'border-slate-200 bg-slate-50/40 hover:border-slate-300 hover:bg-slate-50'
                      }`}
                    >
                      <div className="flex items-start justify-between gap-2 w-full">
                        <span className="text-lg">{p.icon}</span>
                        {qty > 0 && <span className="text-xs font-mono font-extrabold text-amber-800 tabular-nums">{qty}x</span>}
                      </div>
                      <div className="mt-2">
                        <p className="text-xs font-bold text-slate-900 line-clamp-1">{p.name}</p>
                        <div className="flex items-baseline justify-between gap-1 mt-1">
                          <span className="text-sm font-mono font-bold text-slate-900 tabular-nums">{formatCurrency(p.price)}</span>
                          <span className="text-[11px] font-mono text-slate-400 tabular-nums">Custo {formatCurrency(p.cost)}</span>
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="lg:col-span-5 bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col">
            <div className="p-4 sm:p-5 border-b border-slate-200 flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="flex items-center gap-2">
                  <span className="text-xl">{selectedCustomer?.emoji || '👤'}</span>
                  <h3 className="text-sm font-bold text-slate-900 truncate">{selectedCustomer?.name || 'Selecione um amigo'}</h3>
                </div>
                <p className={`text-xs font-mono font-semibold mt-0.5 tabular-nums ${selectedPendingTotal > 0 ? 'text-rose-700' : 'text-emerald-700'}`}>
                  {selectedPendingTotal > 0 ? `Saldo fiado pendente: ${formatCurrency(selectedPendingTotal)}` : 'Conta zerada'}
                </p>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                {selectedCustomer && (
                  <button
                    type="button"
                    onClick={() => onPreviewCustomerReceipt(selectedCustomer)}
                    className="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800 text-xs font-semibold inline-flex items-center gap-1.5 cursor-pointer"
                  >
                    <Icons.Receipt className="w-3.5 h-3.5 text-emerald-600" />
                    <span>Recibo / Zap</span>
                  </button>
                )}
                {cartEntries.length > 0 && (
                  <button type="button" onClick={onClearCart} className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 cursor-pointer">
                    <Icons.Trash2 className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

            <div className="p-4 sm:p-5 space-y-5 flex-1">
              <div>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold text-slate-700">Consumo de {formatDateBR(saleDate)}</span>
                  {cartEntries.length > 0 && <span className="text-xs font-mono text-slate-500">{cartEntries.reduce((a, b) => a + b.qty, 0)} itens</span>}
                </div>
                {cartEntries.length === 0 ? (
                  <div className="p-4 rounded-xl border border-dashed border-slate-200 text-center text-xs text-slate-400">
                    Nenhum item selecionado ainda. Toque nos produtos ao lado.
                  </div>
                ) : (
                  <div className="divide-y divide-slate-100 border border-slate-200 rounded-xl overflow-hidden">
                    {cartEntries.map(({ product, qty, subtotal }) => (
                      <div key={product.id} className="px-3 py-2.5 flex items-center justify-between gap-2 bg-white text-xs">
                        <div className="min-w-0 flex-1">
                          <span className="font-semibold text-slate-900 block truncate">{product.icon} {product.name}</span>
                          <span className="text-[11px] font-mono text-slate-500">{formatCurrency(product.price)} un</span>
                        </div>
                        <div className="flex items-center gap-2.5 shrink-0">
                          <div className="inline-flex items-center border border-slate-200 rounded-lg bg-slate-50">
                            <button type="button" onClick={() => onUpdateCart(product.id, -1)} className="p-1.5 text-slate-600 hover:text-slate-900 cursor-pointer"><Icons.Minus className="w-3 h-3" /></button>
                            <span className="px-2 font-mono font-bold text-slate-900 tabular-nums">{qty}</span>
                            <button type="button" onClick={() => onUpdateCart(product.id, 1)} className="p-1.5 text-slate-600 hover:text-slate-900 cursor-pointer"><Icons.Plus className="w-3 h-3" /></button>
                          </div>
                          <span className="font-mono font-bold text-slate-900 w-16 text-right tabular-nums">{formatCurrency(subtotal)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="border-t border-slate-200 pt-4">
                <span className="text-xs font-semibold text-slate-700 block mb-2">Extrato de Fiados Pendentes</span>
                {selectedPending.length === 0 ? (
                  <p className="text-xs text-slate-400">Sem débitos acumulados para este cliente.</p>
                ) : (
                  <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                    {selectedPending.map((f) => (
                      <div key={f.id} className="p-2.5 rounded-lg bg-slate-50 border border-slate-200 flex items-start justify-between gap-2 text-xs">
                        <div className="min-w-0">
                          <div className="flex items-center gap-1.5 font-mono text-[11px] text-slate-500">
                            <span>{formatDateBR(f.saleDate)}</span>
                            <span>·</span>
                            <span className={isFiadoOverdue(f.dueDate) ? 'text-rose-700 font-semibold' : ''}>Vence {formatDateBR(f.dueDate)}</span>
                          </div>
                          <p className="text-slate-800 font-medium mt-0.5 truncate">{f.notes || `${f.quantity} espetinhos`}</p>
                        </div>
                        <span className="font-mono font-bold text-rose-700 shrink-0 tabular-nums">{formatCurrency(getFiadoRemaining(f))}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="p-4 sm:p-5 border-t border-slate-200 bg-slate-50/70 space-y-3.5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600">Total da Comanda Atual</span>
                <span className="text-xl font-extrabold font-mono text-slate-900 tabular-nums">{formatCurrency(cartTotal)}</span>
              </div>
              <div className="grid grid-cols-2 gap-2.5 items-center text-xs">
                <label className="text-slate-600 font-medium">Vencimento do Fiado:</label>
                <input type="date" value={dueDate} onChange={(e) => onChangeDueDate(e.target.value)} className="px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white font-mono text-xs text-slate-900" />
              </div>
              <label className="flex items-center gap-2 text-xs text-slate-700 cursor-pointer">
                <input type="checkbox" checked={autoNotifyOnLaunch} onChange={(e) => onToggleAutoNotify(e.target.checked)} className="rounded border-slate-300 text-emerald-600" />
                <Icons.MessageCircle className="w-3.5 h-3.5 text-emerald-600 shrink-0" />
                <span>Gerar recibo e notificar no WhatsApp ao lançar fiado</span>
              </label>
              <button
                type="button"
                disabled={cartTotal <= 0 || !selectedCustomer}
                onClick={onLaunchFiado}
                className="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-600 disabled:opacity-45 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer"
              >
                <Icons.PlusCircle className="w-4 h-4" />
                <span>Lançar no Fiado + Gerar Recibo</span>
              </button>
              <div className="pt-2 border-t border-slate-200">
                <span className="text-[11px] font-semibold text-slate-500 block mb-2 text-center">
                  Receber Agora no Caixa ({cartTotal > 0 ? 'Consumo Atual' : 'Abater Fiado'})
                </span>
                <div className="grid grid-cols-3 gap-2">
                  <button type="button" disabled={cartTotal <= 0 && selectedPendingTotal <= 0} onClick={() => onOpenPaymentModal('Pix')} className="py-2 px-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold rounded-lg text-xs cursor-pointer">Pix</button>
                  <button type="button" disabled={cartTotal <= 0 && selectedPendingTotal <= 0} onClick={() => onOpenPaymentModal('Dinheiro')} className="py-2 px-2 bg-sky-700 hover:bg-sky-800 disabled:opacity-40 text-white font-bold rounded-lg text-xs cursor-pointer">Dinheiro</button>
                  <button type="button" disabled={cartTotal <= 0 && selectedPendingTotal <= 0} onClick={() => onOpenPaymentModal('Cartao')} className="py-2 px-2 bg-slate-800 hover:bg-slate-900 disabled:opacity-40 text-white font-bold rounded-lg text-xs cursor-pointer">Cartão</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function FiadosTab({ session, customers, notifications, onOpenCustomerInComandas, onBillCustomer, onSettleCustomer }) {
      const [selectedDate, setSelectedDate] = useState('');
      const [statusFilter, setStatusFilter] = useState('Pendente');
      const [searchQuery, setSearchQuery] = useState('');

      const uniqueDates = useMemo(() => Array.from(new Set(session.fiados.map((f) => f.saleDate))).sort().reverse(), [session.fiados]);

      const metrics = useMemo(() => {
        const pendentes = session.fiados.filter((f) => f.status === 'Pendente' && getFiadoRemaining(f) > 0);
        const totalReceivable = pendentes.reduce((s, f) => s + getFiadoRemaining(f), 0);
        const overdue = pendentes.filter((f) => isFiadoOverdue(f.dueDate));
        const overdueTotal = overdue.reduce((s, f) => s + getFiadoRemaining(f), 0);
        const debtorCount = new Set(pendentes.map((f) => f.customerName.toLowerCase())).size;
        return { totalReceivable, debtorCount, overdueCount: overdue.length, overdueTotal, notificationsCount: notifications.length };
      }, [session.fiados, notifications.length]);

      const filtered = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return session.fiados.filter((f) => {
          if (selectedDate && f.saleDate !== selectedDate) return false;
          if (q && !f.customerName.toLowerCase().includes(q)) return false;
          const rem = getFiadoRemaining(f);
          const isPaid = f.status === 'Pago' || rem <= 0;
          const overdue = !isPaid && isFiadoOverdue(f.dueDate);
          if (statusFilter === 'Pendente') return !isPaid;
          if (statusFilter === 'Vencido') return overdue;
          if (statusFilter === 'Pago') return isPaid;
          return true;
        });
      }, [session.fiados, selectedDate, searchQuery, statusFilter]);

      const grouped = useMemo(() => {
        const map = new Map();
        filtered.forEach((f) => {
          const arr = map.get(f.customerName) || [];
          arr.push(f);
          map.set(f.customerName, arr);
        });
        return Array.from(map.entries()).sort((a, b) => {
          const sumA = a[1].reduce((s, r) => s + getFiadoRemaining(r), 0);
          const sumB = b[1].reduce((s, r) => s + getFiadoRemaining(r), 0);
          return sumB - sumA;
        });
      }, [filtered]);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <span className="text-xs font-medium text-slate-500 block">Total Fiado a Receber</span>
              <div className="text-2xl font-extrabold font-mono text-rose-700 mt-1 tabular-nums">{formatCurrency(metrics.totalReceivable)}</div>
              <span className="text-xs text-slate-500 mt-1 block">{metrics.debtorCount} cliente(s) com saldo aberto</span>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <span className="text-xs font-medium text-slate-500 block">Contas em Atraso</span>
              <div className="text-2xl font-extrabold font-mono text-amber-700 mt-1 tabular-nums">{formatCurrency(metrics.overdueTotal)}</div>
              <span className="text-xs text-slate-500 mt-1 block">{metrics.overdueCount} lançamento(s) vencido(s)</span>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <span className="text-xs font-medium text-slate-500 block">Recibos & Zap Enviados</span>
              <div className="text-2xl font-extrabold font-mono text-emerald-700 mt-1 tabular-nums">{metrics.notificationsCount}</div>
              <span className="text-xs text-slate-500 mt-1 block">Notificações registradas nesta sessão</span>
            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-4">
              <span className="text-xs font-medium text-slate-500 block">Cobrança Detalhada</span>
              <p className="text-xs text-slate-600 mt-1 leading-relaxed">Gera recibo com itens, datas, Pix e disparo direto no WhatsApp do cliente.</p>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-xl p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <div className="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                {[
                  { id: 'Pendente', label: 'Pendentes' },
                  { id: 'Vencido', label: 'Vencidos' },
                  { id: 'Pago', label: 'Quitados' },
                  { id: 'Todos', label: 'Todos' },
                ].map((tab) => (
                  <button
                    key={tab.id}
                    type="button"
                    onClick={() => setStatusFilter(tab.id)}
                    className={`px-3 py-1.5 rounded-md text-xs font-semibold cursor-pointer ${
                      statusFilter === tab.id ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
              <select value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-lg text-xs font-medium bg-slate-50 text-slate-800">
                <option value="">Todas as Datas</option>
                {uniqueDates.map((d) => <option key={d} value={d}>Rodada de {formatDateBR(d)}</option>)}
              </select>
            </div>
            <div className="relative w-full lg:w-64">
              <Icons.Search className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
              <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Filtrar por cliente..." className="w-full pl-8 pr-3 py-2 text-xs border border-slate-200 rounded-lg bg-slate-50" />
            </div>
          </div>

          {grouped.length === 0 ? (
            <div className="bg-white border border-slate-200 rounded-xl p-10 text-center">
              <Icons.CheckCircle2 className="w-8 h-8 text-emerald-600 mx-auto mb-2" />
              <p className="text-sm font-bold text-slate-900">Nenhuma pendência encontrada neste filtro</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {grouped.map(([customerName, items]) => {
                const customer = customers.find((c) => c.name.toLowerCase() === customerName.toLowerCase());
                const emoji = customer?.emoji || '👤';
                const phone = customer?.phone || items[0]?.customerPhone || '';
                const normPhone = normalizePhoneBR(phone);
                const pendingItems = items.filter((f) => f.status === 'Pendente' && getFiadoRemaining(f) > 0);
                const totalPending = pendingItems.reduce((s, f) => s + getFiadoRemaining(f), 0);
                const totalGross = items.reduce((s, f) => s + f.totalAmount, 0);
                const hasOverdue = pendingItems.some((f) => isFiadoOverdue(f.dueDate));
                const lastNotified = items.find((f) => f.lastNotifiedAt)?.lastNotifiedAt;

                return (
                  <div key={customerName} className="bg-white border border-slate-200 rounded-xl p-5 flex flex-col justify-between gap-4">
                    <div>
                      <div className="flex items-start justify-between gap-3 pb-3 border-b border-slate-100">
                        <div className="flex items-center gap-2.5 min-w-0">
                          <span className="text-2xl shrink-0">{emoji}</span>
                          <div className="min-w-0">
                            <h3 className="text-sm font-bold text-slate-900 truncate">{customerName}</h3>
                            <div className="flex flex-wrap items-center gap-1.5 text-xs text-slate-500 mt-0.5">
                              <span className="font-mono">{normPhone ? `+${normPhone}` : 'Sem WhatsApp'}</span>
                              <span>·</span>
                              {totalPending > 0 ? (
                                <span className={`inline-flex items-center gap-1 font-semibold ${hasOverdue ? 'text-rose-700' : 'text-amber-700'}`}>
                                  {hasOverdue ? <Icons.AlertCircle className="w-3 h-3" /> : <Icons.Clock className="w-3 h-3" />}
                                  {hasOverdue ? 'Em atraso' : 'Aguardando acerto'}
                                </span>
                              ) : (
                                <span className="inline-flex items-center gap-1 font-semibold text-emerald-700">
                                  <Icons.CheckCircle2 className="w-3 h-3" /> Quitado
                                </span>
                              )}
                            </div>
                          </div>
                        </div>
                        <div className="text-right shrink-0">
                          <span className="text-[11px] text-slate-500 block">{totalPending > 0 ? 'Saldo Pendente' : 'Total Quitado'}</span>
                          <span className={`text-lg font-extrabold font-mono tabular-nums ${totalPending > 0 ? 'text-rose-700' : 'text-emerald-700'}`}>
                            {formatCurrency(totalPending > 0 ? totalPending : totalGross)}
                          </span>
                        </div>
                      </div>

                      <div className="mt-3 space-y-2 max-h-48 overflow-y-auto pr-1">
                        {items.map((item) => {
                          const rem = getFiadoRemaining(item);
                          const paid = item.paidAmount || 0;
                          const overdue = item.status === 'Pendente' && rem > 0 && isFiadoOverdue(item.dueDate);
                          return (
                            <div key={item.id} className="p-2.5 rounded-lg bg-slate-50 border border-slate-200/80 text-xs flex items-start justify-between gap-2">
                              <div className="min-w-0">
                                <div className="flex items-center gap-1.5 font-mono text-[11px] text-slate-500">
                                  <span>{formatDateBR(item.saleDate)}</span>
                                  <span>·</span>
                                  <span className={overdue ? 'text-rose-700 font-semibold' : ''}>Vence {formatDateBR(item.dueDate)}</span>
                                </div>
                                <p className="text-slate-800 font-medium mt-0.5">{item.notes || `${item.quantity}x Espetinho`}</p>
                                {paid > 0 && rem > 0 && <span className="text-[11px] text-emerald-700 font-mono block mt-0.5">Já abatido: {formatCurrency(paid)}</span>}
                              </div>
                              <div className="text-right shrink-0">
                                <span className="font-mono font-bold text-slate-900 tabular-nums">{formatCurrency(rem > 0 ? rem : item.totalAmount)}</span>
                                <span className="block text-[10px] text-slate-500">{item.status === 'Pago' || rem <= 0 ? 'Pago' : 'Aberto'}</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {lastNotified && (
                        <p className="text-[11px] text-emerald-700 mt-2.5 flex items-center gap-1">
                          <Icons.MessageCircle className="w-3 h-3" /> Última cobrança gerada em {lastNotified}
                        </p>
                      )}
                    </div>

                    <div className="pt-3 border-t border-slate-100 flex flex-wrap items-center gap-2">
                      {pendingItems.length > 0 ? (
                        <>
                          <button type="button" onClick={() => onBillCustomer(customerName, pendingItems)} className="flex-1 py-2 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold inline-flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap">
                            <Icons.Send className="w-3.5 h-3.5" />
                            <span>Recibo & Cobrar Zap</span>
                          </button>
                          <button type="button" onClick={() => onSettleCustomer(customerName, pendingItems)} className="py-2 px-3 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold inline-flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap">
                            <Icons.Wallet className="w-3.5 h-3.5" />
                            <span>Receber</span>
                          </button>
                        </>
                      ) : (
                        <button type="button" onClick={() => onBillCustomer(customerName, items)} className="flex-1 py-2 px-3 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-800 text-xs font-semibold inline-flex items-center justify-center gap-1.5 cursor-pointer">
                          <Icons.Receipt className="w-3.5 h-3.5" />
                          <span>Ver Recibo</span>
                        </button>
                      )}
                      <button type="button" onClick={() => onOpenCustomerInComandas(customerName)} className="py-2 px-3 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold inline-flex items-center gap-1.5 cursor-pointer">
                        <Icons.ShoppingBag className="w-3.5 h-3.5" />
                        <span>Comanda</span>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
            <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h3 className="text-sm font-bold text-slate-900">Registro de Notificações & Recibos via WhatsApp</h3>
                <p className="text-xs text-slate-500">Histórico completo de cobranças e comprovantes detalhados gerados para os clientes</p>
              </div>
              <span className="text-xs font-mono font-semibold text-slate-500">{notifications.length} registro(s)</span>
            </div>
            {notifications.length === 0 ? (
              <div className="p-6 text-center text-xs text-slate-400">Nenhuma notificação gerada ainda.</div>
            ) : (
              <div className="divide-y divide-slate-200">
                {notifications.slice(0, 15).map((log) => (
                  <div key={log.id} className="px-5 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50/70 text-xs">
                    <div className="min-w-0">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="font-mono font-bold text-slate-900">{log.receiptNumber}</span>
                        <span>·</span>
                        <span className="font-semibold text-slate-900">{log.customerName}</span>
                        <span>·</span>
                        <span className="text-slate-500">
                          {log.kind === 'quitacao_pagamento' ? 'Recibo de Quitação' : log.kind === 'lancamento_fiado' ? 'Comprovante de Consumo' : 'Cobrança de Fiado'}
                        </span>
                      </div>

    function LucroTab({ session, products, onUpdateCashCount, onGoToFechamento }) {
      const skewerCost = (session.purchasedSkewersQty || 0) * SKEWER_PURCHASE_COST;
      const otherExpenses = (session.expenses || []).reduce((s, e) => s + (e.amount || 0), 0);
      const totalCost = skewerCost + otherExpenses;
      const cashTotal = (session.cashCount?.cash || 0) + (session.cashCount?.pix || 0) + (session.cashCount?.card || 0);
      const pendingFiados = (session.fiados || []).filter((f) => f.status === 'Pendente' && getFiadoRemaining(f) > 0);
      const totalFiadoPending = pendingFiados.reduce((s, f) => s + getFiadoRemaining(f), 0);
      const realizedProfit = cashTotal - totalCost;
      const projectedProfit = cashTotal + totalFiadoPending - totalCost;
      const marginPct = cashTotal > 0 ? (realizedProfit / cashTotal) * 100 : 0;
      const theoreticalSales = (session.sales || []).reduce((s, x) => s + x.quantity * x.priceType, 0);
      const cashDiff = cashTotal - theoreticalSales;

      return (

            </div>
            <div className="bg-white border border-slate-200 rounded-xl p-5">
              <span className="text-xs font-semibold text-slate-500 block">3. Total Fiado Pendente</span>
              <span className="text-xs text-slate-400 block mt-0.5">Contas em aberto a receber</span>

    function PlanilhaTab({ session }) {
      const handleDownloadCSV = () => {
        const skewerCost = (session.purchasedSkewersQty || 0) * SKEWER_PURCHASE_COST;
        const otherExpenses = (session.expenses || []).reduce((s, e) => s + (e.amount || 0), 0);
        const totalCost = skewerCost + otherExpenses;
        const cashTotal = (session.cashCount?.cash || 0) + (session.cashCount?.pix || 0) + (session.cashCount?.card || 0);
        const totalFiado = (session.fiados || []).filter((f) => f.status === 'Pendente').reduce((s, f) => s + getFiadoRemaining(f), 0);
        const realizedProfit = cashTotal - totalCost;
        const projectedProfit = cashTotal + totalFiado - totalCost;
        const theoreticalSales = (session.sales || []).reduce((s, x) => s + x.quantity * x.priceType, 0);
        const diff = cashTotal - theoreticalSales;

        const rows = [
          ['Secao', 'Item', 'Valor'],
          ['Fechamento', 'Evento', session.eventName.replace(/,/g, ' ')],
          ['Fechamento', 'Data', session.date],
          ['Fechamento', 'Custo Total', totalCost.toFixed(2)],
          ['Fechamento', 'Faturamento Caixa', cashTotal.toFixed(2)],
          ['Fechamento', 'Fiado Pendente', totalFiado.toFixed(2)],
          ['Fechamento', 'Lucro Realizado', realizedProfit.toFixed(2)],
          ['Fechamento', 'Lucro Projetado', projectedProfit.toFixed(2)],
          ['Fechamento', 'Diferenca Caixa', diff.toFixed(2)],
        ];
        const csv = rows.map((r) => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `espetogol_${session.date}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const formulas = [
        { title: '1. Custo Total do Evento', formula: '=(QtdComprada * 5,00) + SOMA(Despesas)' },
        { title: '2. Faturamento Bruto em Caixa', formula: '=SOMA(Dinheiro; Pix; Cartao)' },
        { title: '3. Total Fiado Pendente', formula: '=SOMASE(Status; "Pendente"; SaldoRestante)' },
        { title: '4. Lucro Líquido Realizado', formula: '=FaturamentoCaixa - CustoTotal' },
        { title: '5. Lucro Projetado Total', formula: '=(FaturamentoCaixa + FiadoPendente) - CustoTotal' },
        { title: '6. Diferença de Caixa', formula: '=CaixaConferido - VendasRegistradas' },
      ];

      return (
        <div className="space-y-6 max-w-4xl">
          <div className="bg-white border border-slate-200 rounded-xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-base font-bold text-slate-900">Fórmulas para Google Sheets & Excel</h2>
              <p className="text-xs text-slate-500 mt-0.5">Exporte o CSV real do campeonato atual ou copie as fórmulas em português.</p>
            </div>
            <button type="button" onClick={handleDownloadCSV} className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold inline-flex items-center gap-2 cursor-pointer">
              <Icons.Download className="w-4 h-4" />
              <span>Baixar CSV do Evento</span>
            </button>
          </div>
          <div className="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
            <h3 className="text-sm font-bold text-slate-900">As 6 Fórmulas Principais da Planilha</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
              {formulas.map((f) => (
                <div key={f.title} className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                  <strong className="text-slate-800 block mb-1">{f.title}</strong>
                  <code className="font-mono text-slate-700 break-all">{f.formula}</code>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==================== APLICAÇÃO PRINCIPAL ====================
    function App() {
      const [vendor, setVendor] = useState(() => ({ ...DEFAULT_VENDOR, ...loadJSON('espeto_vendor', DEFAULT_VENDOR) }));
      const [customers, setCustomers] = useState(() => loadJSON('espeto_customers', DEFAULT_CUSTOMERS));
      const [products, setProducts] = useState(() => loadJSON('espeto_products', DEFAULT_PRODUCTS));
      const [payments, setPayments] = useState(() => loadJSON('espeto_payments', DEFAULT_PAYMENTS));
      const [sessions, setSessions] = useState(() => {
        const loaded = loadJSON('espeto_sessions', DEFAULT_SESSIONS);
        return loaded.length > 0 ? loaded : DEFAULT_SESSIONS;
      });
      const [currentSessionId, setCurrentSessionId] = useState(() => localStorage.getItem('espeto_curr_session') || DEFAULT_SESSIONS[0].id);
      const [notifications, setNotifications] = useState(() => loadJSON('espeto_notifications', []));
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('espeto_auth') === 'true');

      const [activeTab, setActiveTab] = useState('comandas');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedCustomerId, setSelectedCustomerId] = useState(() => customers[0]?.id || '');
      const [cart, setCart] = useState({});
      const [saleDate, setSaleDate] = useState(todayIso());
      const [dueDate, setDueDate] = useState(offsetIso(3));
      const [autoNotifyOnLaunch, setAutoNotifyOnLaunch] = useState(vendor.autoNotifyWhatsApp);

      const [activeReceipt, setActiveReceipt] = useState(null);
      const [settleTarget, setSettleTarget] = useState(null);
      const [configOpen, setConfigOpen] = useState(false);
      const [newCampOpen, setNewCampOpen] = useState(false);
      const [pendingConfirm, setPendingConfirm] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => saveJSON('espeto_vendor', vendor), [vendor]);
      useEffect(() => saveJSON('espeto_customers', customers), [customers]);
      useEffect(() => saveJSON('espeto_products', products), [products]);
      useEffect(() => saveJSON('espeto_payments', payments), [payments]);
      useEffect(() => saveJSON('espeto_sessions', sessions), [sessions]);
      useEffect(() => saveJSON('espeto_notifications', notifications), [notifications]);
      useEffect(() => localStorage.setItem('espeto_curr_session', currentSessionId), [currentSessionId]);
      useEffect(() => localStorage.setItem('espeto_auth', isAuthenticated ? 'true' : 'false'), [isAuthenticated]);

      const showToast = (title, description) => {
        const id = String(Date.now());
        setToast({ id, title, description });
        setTimeout(() => setToast((c) => (c?.id === id ? null : c)), 4500);
      };

      const currentSession = useMemo(() => sessions.find((s) => s.id === currentSessionId) || sessions[0], [sessions, currentSessionId]);

      const updateCurrentSession = (updater) => {
        setSessions((prev) => prev.map((s) => (s.id === currentSession.id ? updater(s) : s)));
      };

      const pendingMetrics = useMemo(() => {
        const pendentes = (currentSession?.fiados || []).filter((f) => f.status === 'Pendente' && getFiadoRemaining(f) > 0);
        return {
          count: pendentes.length,
          total: pendentes.reduce((s, f) => s + getFiadoRemaining(f), 0),
        };
      }, [currentSession]);

      const appendNotificationLog = (receipt, mode) => {
        const entry = {
          id: `wa-${Date.now()}`,
          receiptNumber: receipt.receiptNumber,
          customerName: receipt.customerName,
          customerPhone: receipt.customerPhone,
          kind: receipt.kind,
          amount: receipt.amountPaidNow > 0 ? receipt.amountPaidNow : receipt.remainingBalance || receipt.totalGross,
          sentAt: receipt.issuedAt,
          mode,
          messagePreview: receipt.whatsappMessage,
          whatsappUrl: receipt.whatsappUrl,
        };
        setNotifications((prev) => [entry, ...prev]);
      };

      const handleUpdateCart = (pid, delta) => {
        setCart((prev) => {
          const nextQty = (prev[pid] || 0) + delta;
          if (nextQty <= 0) {
            const copy = { ...prev };
            delete copy[pid];
            return copy;
          }
          return { ...prev, [pid]: nextQty };
        });
      };

      const handleLaunchFiado = () => {
        const customer = customers.find((c) => c.id === selectedCustomerId) || customers[0];
        if (!customer) return;

        const lineItems = [];
        let total = 0;
        let skewerQty = 0;

        Object.entries(cart).forEach(([pid, qty]) => {
          if (qty <= 0) return;
          const prod = products.find((p) => p.id === pid);
          if (!prod) return;
          const subtotal = Number((prod.price * qty).toFixed(2));
          total += subtotal;
          lineItems.push({ productId: prod.id, productName: prod.name, quantity: qty, unitPrice: prod.price, subtotal });
          if (prod.category === 'Espetinhos' || prod.name.toLowerCase().includes('espetinho')) skewerQty += qty;
        });

        if (total <= 0 || lineItems.length === 0) return;

        const notes = lineItems.map((i) => `${i.quantity}x ${i.productName}`).join(', ');
        const issuedTimestamp = formatDateTimeBR();
        const newFiado = {
          id: `f-${Date.now()}`,
          customerName: customer.name,
          customerPhone: customer.phone || '',
          saleDate,
          dueDate,
          quantity: skewerQty || lineItems.reduce((s, i) => s + i.quantity, 0),
          unitPrice: skewerQty > 0 ? total / skewerQty : total / lineItems.reduce((s, i) => s + i.quantity, 0),
          totalAmount: total,
          paidAmount: 0,
          status: 'Pendente',
          notes,
          items: lineItems,
          lastNotifiedAt: autoNotifyOnLaunch ? issuedTimestamp : undefined,
        };

        updateCurrentSession((s) => ({ ...s, fiados: [newFiado, ...s.fiados] }));

        const entries = lineItems.map((i) => ({
          date: saleDate,
          dueDate,
          description: i.productName,
          quantity: i.quantity,
          unitPrice: i.unitPrice,
          total: i.subtotal,
        }));

        const hasPhone = normalizePhoneBR(customer.phone).length >= 10;
        const shouldAuto = autoNotifyOnLaunch && hasPhone;

        const receipt = createReceiptData({
          kind: 'lancamento_fiado',
          vendor,
          eventName: currentSession.eventName,
          eventLocation: currentSession.location,
          customerName: customer.name,
          customerPhone: customer.phone || '',
          entries,
          totalGross: total,
          totalPaidBefore: 0,
          amountPaidNow: 0,
          remainingBalance: total,
          autoDispatched: shouldAuto,
        });

        if (shouldAuto) {
          triggerExternalWhatsApp(receipt.whatsappUrl);
          appendNotificationLog(receipt, 'automatico');
        }

        setCart({});
        setActiveReceipt(receipt);
        showToast(`Fiado lançado para ${customer.name}`, shouldAuto ? 'Recibo gerado e notificação WhatsApp acionada.' : 'Recibo detalhado gerado.');
      };

      const handleBillCustomer = (customerName, fiados) => {
        const customer = customers.find((c) => c.name.toLowerCase() === customerName.toLowerCase());
        const phone = customer?.phone || fiados[0]?.customerPhone || '';
        const entries = buildFiadoEntries(fiados);
        const totalGross = fiados.reduce((s, f) => s + f.totalAmount, 0);
        const totalPaidBefore = fiados.reduce((s, f) => s + (f.paidAmount || 0), 0);
        const remainingBalance = fiados.reduce((s, f) => s + getFiadoRemaining(f), 0);
        const hasPhone = normalizePhoneBR(phone).length >= 10;
        const shouldAuto = vendor.autoNotifyWhatsApp && hasPhone && remainingBalance > 0;

        const receipt = createReceiptData({
          kind: remainingBalance > 0 ? 'cobranca_fiado' : 'quitacao_pagamento',
          vendor,
          eventName: currentSession.eventName,
          eventLocation: currentSession.location,
          customerName,
          customerPhone: phone,
          entries,
          totalGross,
          totalPaidBefore,
          amountPaidNow: 0,
          remainingBalance,
          autoDispatched: shouldAuto,
        });

        if (shouldAuto) {
          triggerExternalWhatsApp(receipt.whatsappUrl);
          appendNotificationLog(receipt, 'automatico');
          const nowLabel = formatDateTimeBR();
          const ids = new Set(fiados.map((f) => f.id));
          updateCurrentSession((s) => ({
            ...s,
            fiados: s.fiados.map((f) => (ids.has(f.id) ? { ...f, lastNotifiedAt: nowLabel } : f)),
          }));
        }
        setActiveReceipt(receipt);
      };

      const handlePreviewCustomerReceipt = (customer) => {
        const pending = currentSession.fiados.filter((f) => f.customerName.toLowerCase() === customer.name.toLowerCase() && f.status === 'Pendente' && getFiadoRemaining(f) > 0);
        const cartRows = [];
        Object.entries(cart).forEach(([pid, qty]) => {
          if (qty <= 0) return;
          const prod = products.find((p) => p.id === pid);
          if (!prod) return;
          cartRows.push({ date: saleDate, dueDate, description: `${prod.name} (Comanda atual)`, quantity: qty, unitPrice: prod.price, total: Number((prod.price * qty).toFixed(2)) });
        });
        const allRows = [...cartRows, ...buildFiadoEntries(pending)];
        if (allRows.length === 0) {
          showToast('Nenhum item para recibo', 'Adicione produtos ou selecione um cliente com fiados.');
          return;
        }
        const cartTotal = cartRows.reduce((s, r) => s + r.total, 0);
        const pendingGross = pending.reduce((s, f) => s + f.totalAmount, 0);
        const pendingPaid = pending.reduce((s, f) => s + (f.paidAmount || 0), 0);
        const remaining = cartTotal + pending.reduce((s, f) => s + getFiadoRemaining(f), 0);

        setActiveReceipt(createReceiptData({
          kind: 'cobranca_fiado',
          vendor,
          eventName: currentSession.eventName,
          eventLocation: currentSession.location,
          customerName: customer.name,
          customerPhone: customer.phone || '',
          entries: allRows,
          totalGross: cartTotal + pendingGross,
          totalPaidBefore: pendingPaid,
          amountPaidNow: 0,
          remainingBalance: remaining,
          autoDispatched: false,
        }));
      };

      const handleOpenPaymentModalFromComanda = (method) => {
        const customer = customers.find((c) => c.id === selectedCustomerId) || customers[0];
        if (!customer) return;

        const cartRows = [];
        let cartTotal = 0;
        Object.entries(cart).forEach(([pid, qty]) => {
          if (qty <= 0) return;
          const prod = products.find((p) => p.id === pid);
          if (!prod) return;
          const sub = Number((prod.price * qty).toFixed(2));
          cartTotal += sub;
          cartRows.push({ date: saleDate, description: prod.name, quantity: qty, unitPrice: prod.price, total: sub });
        });

        if (cartTotal > 0) {
          setSettleTarget({
            mode: 'cart',
            customerName: customer.name,
            customerPhone: customer.phone || '',
            totalDue: cartTotal,
            initialMethod: method,
            entries: cartRows,
            totalGross: cartTotal,
            totalPaidBefore: 0,
          });
          return;
        }

        const pending = currentSession.fiados.filter((f) => f.customerName.toLowerCase() === customer.name.toLowerCase() && f.status === 'Pendente' && getFiadoRemaining(f) > 0);
        const totalPending = pending.reduce((s, f) => s + getFiadoRemaining(f), 0);
        if (totalPending <= 0) return;

        setSettleTarget({
          mode: 'fiados',
          customerName: customer.name,
          customerPhone: customer.phone || '',
          totalDue: totalPending,
          initialMethod: method,
          fiadoIds: pending.map((f) => f.id),
          entries: buildFiadoEntries(pending),
          totalGross: pending.reduce((s, f) => s + f.totalAmount, 0),
          totalPaidBefore: pending.reduce((s, f) => s + (f.paidAmount || 0), 0),
        });
      };

      const handleOpenSettleFromFiados = (customerName, fiados) => {
        const customer = customers.find((c) => c.name.toLowerCase() === customerName.toLowerCase());
        const phone = customer?.phone || fiados[0]?.customerPhone || '';
        const totalPending = fiados.reduce((s, f) => s + getFiadoRemaining(f), 0);
        setSettleTarget({
          mode: 'fiados',
          customerName,
          customerPhone: phone,
          totalDue: totalPending,
          initialMethod: 'Pix',
          fiadoIds: fiados.map((f) => f.id),
          entries: buildFiadoEntries(fiados),
          totalGross: fiados.reduce((s, f) => s + f.totalAmount, 0),
          totalPaidBefore: fiados.reduce((s, f) => s + (f.paidAmount || 0), 0),
        });
      };

      const handleConfirmSettle = ({ amount, method, notes, sendWhatsApp }) => {
        if (!settleTarget) return;
        const cashField = method === 'Dinheiro' ? 'cash' : method === 'Pix' ? 'pix' : 'card';
        const remainingAfter = Math.max(0, Number((settleTarget.totalDue - amount).toFixed(2)));
        const hasPhone = normalizePhoneBR(settleTarget.customerPhone).length >= 10;
        const shouldAuto = sendWhatsApp && hasPhone;

        const receipt = createReceiptData({
          kind: 'quitacao_pagamento',
          vendor,
          eventName: currentSession.eventName,
          eventLocation: currentSession.location,
          customerName: settleTarget.customerName,
          customerPhone: settleTarget.customerPhone,
          paymentMethod: method,
          entries: settleTarget.entries,
          totalGross: settleTarget.totalGross,
          totalPaidBefore: settleTarget.totalPaidBefore,
          amountPaidNow: amount,
          remainingBalance: remainingAfter,
          autoDispatched: shouldAuto,
        });

        updateCurrentSession((s) => {
          let rem = amount;
          const targetIds = new Set(settleTarget.fiadoIds || []);
          const today = todayIso();
          const updatedFiados =
            settleTarget.mode === 'fiados'
              ? s.fiados.map((f) => {
                  if (!targetIds.has(f.id) || rem <= 0) return f;
                  const open = getFiadoRemaining(f);
                  if (open <= 0) return f;
                  const applied = Math.min(open, rem);
                  rem = Number((rem - applied).toFixed(2));
                  const newPaid = Number(((f.paidAmount || 0) + applied).toFixed(2));
                  const full = newPaid >= f.totalAmount - 0.009;
                  return { ...f, paidAmount: newPaid, status: full ? 'Pago' : 'Pendente', paidDate: full ? today : f.paidDate, lastNotifiedAt: shouldAuto ? receipt.issuedAt : f.lastNotifiedAt };
                })
              : s.fiados;
          return {
            ...s,
            cashCount: { ...s.cashCount, [cashField]: Number(((s.cashCount?.[cashField] || 0) + amount).toFixed(2)) },
            fiados: updatedFiados,
          };
        });

        if (settleTarget.mode === 'cart') setCart({});

        setPayments((prev) => [
          {
            id: Date.now(),
            customerName: settleTarget.customerName,
            customerPhone: settleTarget.customerPhone,
            dateStr: new Date().toLocaleDateString('pt-BR'),
            amount,
            paymentMethod: method,
            notes: notes || (settleTarget.mode === 'cart' ? `Consumo à vista (${method})` : remainingAfter <= 0 ? `Quitação via ${method}` : `Abatimento parcial via ${method}`),
            receiptCode: receipt.receiptNumber,
          },
          ...prev,
        ]);

        if (shouldAuto) {
          triggerExternalWhatsApp(receipt.whatsappUrl);
          appendNotificationLog(receipt, 'automatico');
        }

        setSettleTarget(null);
        setActiveReceipt(receipt);
        showToast(`Pagamento recebido via ${method}`, shouldAuto ? 'Recibo enviado automaticamente no WhatsApp.' : 'Recibo detalhado gerado.');
      };

      const handleConfirmAction = () => {
        if (!pendingConfirm) return;
        if (pendingConfirm.kind === 'delete_session' && sessions.length > 1) {
          const next = sessions.filter((s) => s.id !== currentSession.id);
          setSessions(next);
          setCurrentSessionId(next[0].id);
          showToast('Campeonato excluído');
        } else if (pendingConfirm.kind === 'refund_payment') {
          const p = pendingConfirm.payment;
          setPayments((prev) => prev.filter((item) => item.id !== p.id));
          const cashField = p.paymentMethod === 'Dinheiro' ? 'cash' : p.paymentMethod === 'Pix' ? 'pix' : 'card';
          updateCurrentSession((s) => ({
            ...s,
            cashCount: { ...s.cashCount, [cashField]: Math.max(0, (s.cashCount?.[cashField] || 0) - p.amount) },
          }));
          showToast('Pagamento estornado', `Valor removido do caixa de ${p.paymentMethod}.`);
        } else if (pendingConfirm.kind === 'delete_customer') {
          setCustomers((prev) => prev.filter((c) => c.id !== pendingConfirm.customer.id));
          if (selectedCustomerId === pendingConfirm.customer.id) setSelectedCustomerId('');
          showToast('Cliente removido', pendingConfirm.customer.name);
        } else if (pendingConfirm.kind === 'delete_product') {
          setProducts((prev) => prev.filter((p) => p.id !== pendingConfirm.product.id));
          showToast('Produto removido', pendingConfirm.product.name);
        }
        setPendingConfirm(null);
      };

      if (!isAuthenticated) {
        return <LoginScreen vendorName={vendor.name} expectedPin={vendor.pinCode} onSuccess={() => setIsAuthenticated(true)} />;
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex">
          <Sidebar
            activeTab={activeTab}
            onSelectTab={setActiveTab}
            pendingFiadoCount={pendingMetrics.count}
            pendingFiadoTotal={pendingMetrics.total}
            vendorName={vendor.name}
            onLock={() => setIsAuthenticated(false)}
            mobileOpen={mobileMenuOpen}
            onCloseMobile={() => setMobileMenuOpen(false)}
          />

          <div className="flex-1 min-w-0 flex flex-col">
            <TopBar
              sessions={sessions}
              currentSession={currentSession}
              vendor={vendor}
              onSelectSession={setCurrentSessionId}
              onOpenNewSession={() => setNewCampOpen(true)}
              onRequestDeleteSession={() => setPendingConfirm({ kind: 'delete_session' })}
              onOpenConfig={() => setConfigOpen(true)}
              onOpenMobileMenu={() => setMobileMenuOpen(true)}
            />

            <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
              {activeTab === 'comandas' && (
                <ComandasTab
                  session={currentSession}
                  customers={customers}
                  products={products}
                  selectedCustomerId={selectedCustomerId}
                  cart={cart}
                  saleDate={saleDate}
                  dueDate={dueDate}
                  autoNotifyOnLaunch={autoNotifyOnLaunch}
                  onChangeSaleDate={setSaleDate}
                  onChangeDueDate={setDueDate}
                  onToggleAutoNotify={setAutoNotifyOnLaunch}
                  onSelectCustomer={setSelectedCustomerId}
                  onUpdateCart={handleUpdateCart}
                  onClearCart={() => setCart({})}
                  onLaunchFiado={handleLaunchFiado}
                  onOpenPaymentModal={handleOpenPaymentModalFromComanda}
                  onPreviewCustomerReceipt={handlePreviewCustomerReceipt}
                />
              )}

              {activeTab === 'devedores' && (
                <FiadosTab
                  session={currentSession}
                  customers={customers}
                  notifications={notifications}
                  onOpenCustomerInComandas={(name) => {
                    const f = customers.find((c) => c.name.toLowerCase() === name.toLowerCase());
                    if (f) setSelectedCustomerId(f.id);
                    setActiveTab('comandas');
                  }}
                  onBillCustomer={handleBillCustomer}
                  onSettleCustomer={handleOpenSettleFromFiados}
                />
              )}

              {activeTab === 'lucro' && (
                <LucroTab
                  session={currentSession}
                  products={products}
                  onUpdateCashCount={(field, value) => updateCurrentSession((s) => ({ ...s, cashCount: { ...s.cashCount, [field]: value } }))}
                  onGoToFechamento={() => setActiveTab('fechamento')}
                />
              )}

              {activeTab === 'compras' && (
                <ComprasTab
                  session={currentSession}
                  onUpdateSkewersQty={(qty) => updateCurrentSession((s) => ({ ...s, purchasedSkewersQty: qty }))}
                  onAddExpense={(exp) => { updateCurrentSession((s) => ({ ...s, expenses: [...s.expenses, { id: `e-${Date.now()}`, ...exp }] })); showToast('Despesa adicionada', exp.description); }}
                  onDeleteExpense={(id) => updateCurrentSession((s) => ({ ...s, expenses: s.expenses.filter((e) => e.id !== id) }))}
                />
              )}

              {activeTab === 'historico' && (
                <HistoricoTab payments={payments} onRequestRefund={(payment) => setPendingConfirm({ kind: 'refund_payment', payment })} />
              )}

              {activeTab === 'clientes' && (
                <ClientesTab
                  customers={customers}
                  onAddCustomer={(c) => { const created = { id: `c-${Date.now()}`, ...c }; setCustomers((prev) => [...prev, created]); if (!selectedCustomerId) setSelectedCustomerId(created.id); showToast('Cliente cadastrado', created.name); }}
                  onRequestDeleteCustomer={(customer) => setPendingConfirm({ kind: 'delete_customer', customer })}
                />
              )}

              {activeTab === 'produtos' && (
                <ProdutosTab
                  products={products}
                  onAddProduct={(p) => { setProducts((prev) => [...prev, { id: `p-${Date.now()}`, ...p }]); showToast('Produto salvo', p.name); }}
                  onRequestDeleteProduct={(product) => setPendingConfirm({ kind: 'delete_product', product })}
                />
              )}

              {activeTab === 'fechamento' && <FechamentoTab session={currentSession} vendor={vendor} />}
              {activeTab === 'planilha' && <PlanilhaTab session={currentSession} />}
            </main>
          </div>

          <ReceiptModal receipt={activeReceipt} vendor={vendor} onClose={() => setActiveReceipt(null)} onManualResend={(r) => appendNotificationLog(r, 'manual')} />

          <SettleFiadoModal
            isOpen={settleTarget !== null}
            customerName={settleTarget?.customerName || ''}
            customerPhone={settleTarget?.customerPhone || ''}
            totalDue={settleTarget?.totalDue || 0}
            initialMethod={settleTarget?.initialMethod || 'Pix'}
            defaultAutoNotify={vendor.autoNotifyWhatsApp}
            onClose={() => setSettleTarget(null)}
            onConfirm={handleConfirmSettle}
          />

          <VendorConfigModal
            isOpen={configOpen}
            vendor={vendor}
            onClose={() => setConfigOpen(false)}
            onSave={(updated) => { setVendor(updated); setAutoNotifyOnLaunch(updated.autoNotifyWhatsApp); setConfigOpen(false); showToast('Configurações salvas'); }}
          />

          <NewChampionshipModal
            isOpen={newCampOpen}
            onClose={() => setNewCampOpen(false)}
            onCreate={({ eventName, date, location, purchasedSkewersQty }) => {
              const created = {
                id: `sess-${Date.now()}`, eventName, date, location, purchasedSkewersQty,
                expenses: [],
                sales: [
                  { id: `s-${Date.now()}-1`, period: '1º Tempo', priceType: 10, quantity: 0 },
                  { id: `s-${Date.now()}-2`, period: 'Final / Promo', priceType: 8, quantity: 0 },
                ],
                cashCount: { cash: 0, pix: 0, card: 0 },
                fiados: [],
              };
              setSessions((prev) => [created, ...prev]);
              setCurrentSessionId(created.id);
              setNewCampOpen(false);
              showToast('Novo campeonato iniciado', eventName);
            }}
          />

          <ConfirmModal
            isOpen={pendingConfirm !== null}
            title={
              pendingConfirm?.kind === 'delete_session' ? 'Excluir Campeonato'
              : pendingConfirm?.kind === 'refund_payment' ? 'Estornar Pagamento'
              : pendingConfirm?.kind === 'delete_customer' ? 'Excluir Cliente'
              : 'Excluir Produto'
            }
            description={
              pendingConfirm?.kind === 'delete_session' ? `Excluir "${currentSession.eventName}" e seus lançamentos?`
              : pendingConfirm?.kind === 'refund_payment' ? `Estornar pagamento de ${pendingConfirm.payment.customerName}? O valor será abatido do caixa.`
              : pendingConfirm?.kind === 'delete_customer' ? `Remover ${pendingConfirm.customer.name}?`
              : pendingConfirm?.kind === 'delete_product' ? `Remover ${pendingConfirm.product.name} do cardápio?`
              : ''
            }
            confirmLabel={pendingConfirm?.kind === 'refund_payment' ? 'Estornar' : 'Excluir'}
            onCancel={() => setPendingConfirm(null)}
            onConfirm={handleConfirmAction}
          />

          <ToastBanner toast={toast} onDismiss={() => setToast(null)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
